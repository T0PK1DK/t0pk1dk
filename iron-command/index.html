<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1220" />
  <title>IRON COMMAND · Auto-General</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script type="module" crossorigin src="./assets/main-B9xj6q0_.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-BTn-X1SE.js">
  <link rel="modulepreload" crossorigin href="./assets/icons-C5gAoBCT.js">
  <link rel="modulepreload" crossorigin href="./assets/juice-BCBvM2tZ.js">
  <link rel="stylesheet" crossorigin href="./assets/icons-DREe5Jx0.css">
</head>
<body>
  <div id="app">
    <header class="hud-top">
      <div class="hq-bar enemy"><span class="lbl">ENEMY HQ</span><div class="bar"><i id="hq1"></i></div></div>
      <div id="clock" class="clock">0:00</div>
      <button id="btn-menu" class="menu-btn" aria-label="Menu">☰</button>
    </header>
    <canvas id="board" aria-label="Battlefield"></canvas>
    <div id="lane-orders" class="lane-orders"></div>
    <div id="turn-banner" class="turn-banner" hidden></div>
    <footer class="hud-bottom">
      <div class="hq-bar you"><span class="lbl">YOUR HQ</span><div class="bar"><i id="hq0"></i></div></div>
      <div class="econ">
        <div class="credits"><span class="gem">◆</span><b id="credits">0</b><small id="income">+0/s</small></div>
        <button id="btn-base" class="chip base">🏗️ Base</button>
        <button id="btn-strike" class="chip strike"><span>✈️ Strike</span><i id="strike-cd"></i></button>
      </div>
      <div id="tray" class="tray"></div>
    </footer>
    <section id="base-sheet" class="sheet" hidden>
      <h2>Your Base</h2>
      <div id="base-list" class="base-list"></div>
      <button id="base-close" class="big">Back to battle</button>
    </section>
    <section id="menu-sheet" class="sheet" hidden>
      <h2>Menu</h2>
      <div class="base-list">
        <button id="menu-restart" class="big wide">⚔️ Restart match</button>
        <button id="menu-tips" class="big wide">❓ Show tips</button>
        <a id="menu-classic" class="big wide link" href="./hex.html">⬢ Classic mode (hex map)</a>
        <a id="menu-war" class="big wide link" href="./war.html">🗺️ War: Territory</a>
      </div>
      <button id="menu-close" class="big">Back to battle</button>
    </section>
    <section id="tip" class="tip" hidden><p id="tip-text"></p><div class="tip-row"><span id="tip-n"></span><button id="tip-next" class="big">Got it</button></div></section>
    <section id="end" class="end" hidden>
      <div class="end-card"><div id="end-icon" class="end-icon">🏆</div><h2 id="end-title">VICTORY</h2><p id="end-sub"></p><button id="btn-restart" class="big">Play again</button></div>
    </section>
  </div>
</body>
</html>
