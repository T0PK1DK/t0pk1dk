<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1220" />
  <title>IRON COMMAND · War: Territory (3D)</title>
  <meta name="description" content="Iron Command War: Territory. Paint a big hex map in your colour, take supply depots and outposts, hold 70% to win." />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script type="module" crossorigin src="./assets/war-BnSgOvjZ.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-BTn-X1SE.js">
  <link rel="modulepreload" crossorigin href="./assets/shell-BrT3hWMe.js">
  <link rel="modulepreload" crossorigin href="./assets/entry-Bw4ugcej.js">
  <link rel="stylesheet" crossorigin href="./assets/shell-B-54c5mB.css">
  <link rel="stylesheet" crossorigin href="./assets/war-DUNPjjx6.css">
</head>
<body class="on-title">
  <div id="app">
    <header class="hud-top">
      <div class="hq-bar enemy"><span class="lbl">ENEMY HQ</span><div class="bar"><i id="hq1"></i></div></div>
      <div id="clock" class="clock">0:00</div>
      <button id="btn-menu" class="menu-btn" aria-label="Menu">☰</button>
    </header>
    <div id="terr" class="terr-bar" aria-label="Territory"><b id="terr-you">0%</b><div class="terr-track"><i id="terr-fill-you"></i><i id="terr-fill-ai"></i><span class="terr-goal" title="70% wins"></span></div><b id="terr-ai">0%</b></div>
    <div class="board-wrap"><canvas id="board" aria-label="3D war map"></canvas><canvas id="minimap" class="minimap" aria-label="Minimap"></canvas><div class="zoom-btns"><button id="zoom-in" aria-label="Zoom in">＋</button><button id="zoom-out" aria-label="Zoom out">－</button><button id="zoom-rot" aria-label="Rotate view">⟳</button><button id="zoom-home" aria-label="Back to base">🏠</button></div></div>
    <div id="region-orders" class="region-orders"></div>
        <div id="turn-banner" class="turn-banner" hidden></div>
    <footer class="hud-bottom">
      <div class="hq-bar you"><span class="lbl">YOUR HQ</span><div class="bar"><i id="hq0"></i></div></div>
      <div class="econ">
        <div class="credits"><span class="gem">◆</span><b id="credits">0</b><small id="income">+0/s</small></div>
        <button id="btn-base" class="chip base">🏗️ Base</button>
        <button id="btn-strike" class="chip strike"><span>✈️ Strike</span><i id="strike-cd"></i></button>
      </div>
      <div id="tray" class="tray"></div>
    </footer>
    <section id="base-sheet" class="sheet" hidden>
      <h2>Your Base</h2>
      <div id="base-list" class="base-list"></div>
      <button id="base-close" class="big">Back to battle</button>
    </section>
    <section id="menu-sheet" class="sheet" hidden>
      <h2>Menu</h2>
      <div class="base-list">
        <button id="menu-home" class="big wide">🏠 Title screen</button>
        <button id="menu-restart" class="big wide">⚔️ Restart match</button>
        <button id="menu-tips" class="big wide">❓ Show tips</button>
        <div id="menu-maps" class="menu-maps"></div>
        <a id="menu-lanes" class="big wide link" href="./index.html">⚡ Lane battle</a>
        <a id="menu-classic" class="big wide link" href="./hex.html">⬢ Classic (hex)</a>
        <a id="menu-2d" class="big wide link" href="./war-2d.html">🧭 2D tactical view</a>
        <a id="menu-turns" class="big wide link" href="./hex-turns.html">♟️ Turn-based Classic (legacy)</a>
      </div>
      <button id="menu-close" class="big">Back to battle</button>
    </section>
    <section id="tip" class="tip" hidden><p id="tip-text"></p><div class="tip-row"><span id="tip-n"></span><button id="tip-next" class="big">Got it</button></div></section>
    <div id="drag-ghost" class="drag-ghost" hidden></div>
    <section id="end" class="end" hidden>
      <div class="end-card"><div id="end-icon" class="end-icon">🏆</div><h2 id="end-title">VICTORY</h2><p id="end-sub"></p>
        <div class="end-actions"><button id="btn-restart" class="big">Rematch</button><button id="btn-menu-home" class="big alt">Menu</button></div></div>
    </section>
    <div id="boot" class="boot">
      <div id="boot-spin" class="boot-spin" aria-label="Loading"></div>
      <section id="title" class="title-screen" aria-label="Start">
        <span class="nard-badge">Nard Labs</span>
        <h1>IRON<br>COMMAND</h1>
        <p class="tag">Drop troops. Give orders. Win the field.</p>
        <button id="btn-play" class="play-btn" type="button">PLAY</button>
        <nav class="mode-picker" aria-label="Game modes">
          <a href="./index.html" data-mode="lanes"><b>⚡ Lanes</b><small>Three roads</small></a>
          <a href="./hex.html" data-mode="hex"><b>⬢ Hex</b><small>Classic 3D</small></a>
          <a href="./war.html" data-mode="war"><b>🗺️ War 3D</b><small>Paint the map</small></a>
          <a href="./war-2d.html" data-mode="war2d"><b>🧭 War 2D</b><small>Tactical view</small></a>
        </nav>
        <button id="btn-tut-replay" class="ghost-btn" type="button" hidden>Replay tutorial</button>
      </section>
    </div>
    <aside id="coach" class="coach" hidden>
      <button id="coach-skip" class="skip-btn" type="button">Skip</button>
      <p id="coach-text"></p>
      <span id="coach-n"></span>
    </aside>
  </div>
  <script>setTimeout(function(){document.documentElement.classList.add("booted");},8000);</script>
</body>
</html>
